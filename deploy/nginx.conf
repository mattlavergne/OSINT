# Serving GhostTrace at https://mattlavergne.com/OSINT from a VPS.
#
# Use this only if you are running the Node server (`npm run dev:node`) instead
# of deploying to Cloudflare Pages. Start the app with a matching mount point:
#
#   BASE_PATH=/OSINT PORT=8787 node server/index.mjs
#
# Drop this inside the existing `server { }` block for mattlavergne.com.

location /OSINT {
    # No trailing slash on proxy_pass: nginx forwards the full original URI,
    # including the /OSINT prefix, and the Node server strips it using BASE_PATH.
    proxy_pass http://127.0.0.1:8787;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /OSINT;

    # Lookups fan out to several third-party APIs; allow for the slowest.
    proxy_connect_timeout 10s;
    proxy_read_timeout    45s;
    proxy_send_timeout    30s;

    # Nothing here is streamed, so buffering is fine and takes load off Node.
    proxy_buffering on;
}

# The 8 MB of phone reference data never changes between builds. Serving it
# straight off disk keeps it out of the Node process entirely.
location /OSINT/data/phone/ {
    alias /srv/ghosttrace/public/data/phone/;
    add_header Cache-Control "public, max-age=86400" always;
    access_log off;
    try_files $uri =404;
}
