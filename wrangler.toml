# GhostTrace — single Worker serving both the static frontend and the API.
#
# Deploy:  npx wrangler deploy
# Local:   npx wrangler dev
#
# Run `npm run build` first (or let the dashboard's build command do it) —
# public/data/phone/ is generated, not committed.

name = "osint"
main = "src/worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker must see every request so it can strip the /OSINT mount prefix
# before looking anything up. Without this, Cloudflare would try to match the
# prefixed path against the asset manifest and miss.
run_worker_first = true

# Mounts the app at https://mattlavergne.com/osint.
#
# The zone already has `trafficmap-proxy` on `mattlavergne.com/*`. Cloudflare
# resolves overlapping routes by specificity, so these more specific patterns
# win for /osint while the existing Worker keeps serving everything else.
#
# The trailing `*` is load-bearing: without it the route matches only the bare
# /osint URL, and every asset and API call underneath falls through to the
# other Worker — the page renders with no stylesheet and no script.
#
# Both cases are listed because Cloudflare route paths are case-sensitive,
# so /osint* and /OSINT* are genuinely different routes.
routes = [
  { pattern = "mattlavergne.com/osint*", zone_name = "mattlavergne.com" },
  { pattern = "mattlavergne.com/OSINT*", zone_name = "mattlavergne.com" }
]

# Optional enrichment keys — the app is fully functional without them:
#   npx wrangler secret put SHODAN_API_KEY
#   npx wrangler secret put VIRUSTOTAL_API_KEY
#   npx wrangler secret put ABUSEIPDB_API_KEY
#   npx wrangler secret put GREYNOISE_API_KEY
#   npx wrangler secret put TWILIO_ACCOUNT_SID
#   npx wrangler secret put TWILIO_AUTH_TOKEN
#   npx wrangler secret put BRAVE_SEARCH_API_KEY
#   npx wrangler secret put HIBP_API_KEY
#   npx wrangler secret put GITHUB_TOKEN
#
# Note on scan depth: a `depth=deep` lookup makes roughly 100 subrequests, which
# is over the free plan's 50-per-request ceiling. Deep scans need the Workers
# Paid plan; on the free plan they degrade to a partial report rather than
# failing outright. See the README section on free-plan limits.
